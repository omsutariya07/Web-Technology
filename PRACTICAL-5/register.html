<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
</head>
<body>

<main>
  <h1>Student Registration</h1>

  <form id="register-form" novalidate>

    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" autocomplete="name" required aria-describedby="name-error" placeholder="Enter your full name">
      <span class="error-msg" id="name-error" role="alert"></span>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-error" placeholder="you@example.com">
      <span class="error-msg" id="email-error" role="alert"></span>
    </div>

    <div class="form-group">
      <label for="mobile">Mobile Number</label>
      <input type="tel" id="mobile" name="mobile" autocomplete="tel" required aria-describedby="mobile-error" placeholder="10-digit number">
      <span class="error-msg" id="mobile-error" role="alert"></span>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required aria-describedby="password-error password-strength" placeholder="Create a password">
      <span class="error-msg" id="password-error" role="alert"></span>
      <div class="strength-meter">
        <div class="strength-bar" id="strength-bar"></div>
      </div>
      <span id="strength-text" aria-live="polite"></span>
    </div>

    <div class="form-group">
      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required aria-describedby="confirm-password-error" placeholder="Re-enter your password">
      <span class="error-msg" id="confirm-password-error" role="alert"></span>
    </div>

    <div class="form-group">
      <label for="course">Course</label>
      <select id="course" name="course" required aria-describedby="course-error">
        <option value="">Select course</option>
        <option value="cse">B.Tech - Computer Science</option>
        <option value="aiml">B.Tech - AI &amp; ML</option>
        <option value="it">B.Tech - IT</option>
        <option value="ce">B.Tech - Civil</option>
      </select>
      <span class="error-msg" id="course-error" role="alert"></span>
    </div>

    <div class="form-group">
      <label for="year">Year</label>
      <select id="year" name="year" required aria-describedby="year-error">
        <option value="">Select year</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>
      </select>
      <span class="error-msg" id="year-error" role="alert"></span>
    </div>

    <fieldset class="form-group">
      <legend>Gender</legend>
      <label class="inline-label"><input type="radio" name="gender" value="male" required> Male</label>
      <label class="inline-label"><input type="radio" name="gender" value="female"> Female</label>
      <label class="inline-label"><input type="radio" name="gender" value="other"> Other</label>
      <span class="error-msg" id="gender-error" role="alert"></span>
    </fieldset>

    <div class="form-group">
      <label class="inline-label"><input type="checkbox" id="terms" name="terms" required> I agree to the terms and conditions</label>
      <span class="error-msg" id="terms-error" role="alert"></span>
    </div>

    <button type="submit">Register</button>
    <p id="success-msg" aria-live="polite"></p>

  </form>
</main>

<script src="register.js" defer></script>
</body>
</html>
